[pytest]
# Keeping this config inside `tests/` pins pytest's rootdir to this
# directory, which prevents it from walking up and importing the
# repo-root `__init__.py` (that init eagerly registers BN plugin
# commands and fails outside Binary Ninja). Test files load each
# helper module by file path, so the package layout never needs to
# be imported.
addopts = --import-mode=importlib
